<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#650000">
<title>Majalah Olahraga — Flipbook</title>
<style>
:root{--red:#710000;--red2:#a60000;--gold:#ffd400;--ink:#f7f3ed;--ratio:0.707}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 25%,#4b1717 0,#1a1012 52%,#09090b 100%);color:var(--ink);font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column;overflow-x:hidden}
header{padding:18px 22px 6px;text-align:center}
header .eyebrow{font-size:11px;letter-spacing:4px;color:#e6b7a5;text-transform:uppercase}
header h1{margin:5px 0 0;font-size:clamp(18px,2.8vw,28px);letter-spacing:2px;text-transform:uppercase}
header h1 span{color:var(--gold)}

.stage{
  position:relative;
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px 76px 24px;
  min-height:0;
  overflow:hidden;
}

.book-wrap{
  position:relative;
  z-index:1;
  height:min(82vh, 840px);
  width:auto;
  aspect-ratio:calc(var(--ratio) * 2);
  max-width:calc(100vw - 152px);
  perspective:2600px;
  filter:drop-shadow(0 26px 38px rgba(0,0,0,.8));
}

.book{
  position:relative;
  width:100%;
  height:100%;
  transform-style:preserve-3d;
  transition:transform .85s cubic-bezier(0.645, 0.045, 0.355, 1);
}

.book.pos-cover{ transform:translateX(-25%); }
.book.pos-spread{ transform:translateX(0%); }
.book.pos-back{ transform:translateX(25%); }

.leaf{
  position:absolute;
  top:0;
  right:0;
  width:50%;
  height:100%;
  transform-origin:left center;
  transform-style:preserve-3d;
  cursor:pointer;
  will-change:transform;
  transition:transform .9s cubic-bezier(0.645, 0.045, 0.355, 1);
}

.leaf.flipped{
  transform:rotateY(-180deg);
}

.face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  overflow:hidden;
  background:#1c1917;
}

.face.front{
  border-radius:2px 8px 8px 2px;
  box-shadow:inset 10px 0 20px rgba(0,0,0,.35);
}

.face.back{
  transform:rotateY(180deg);
  border-radius:8px 2px 2px 8px;
  box-shadow:inset -10px 0 20px rgba(0,0,0,.35);
}

.face img{
  display:block;
  width:100%;
  height:100%;
  object-fit:fill;
  user-select:none;
}

.face.front::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(to right, rgba(0,0,0,.42) 0%, rgba(0,0,0,.1) 3%, rgba(255,255,255,.15) 6%, transparent 15%);
}
.face.back::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(to left, rgba(0,0,0,.42) 0%, rgba(0,0,0,.1) 3%, rgba(255,255,255,.15) 6%, transparent 15%);
}

.lighting{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
  transition:opacity .45s ease;
}
.face.front .lighting{
  background:linear-gradient(105deg, transparent 25%, rgba(255,255,255,.26) 50%, rgba(0,0,0,.32) 85%);
}
.face.back .lighting{
  background:linear-gradient(-105deg, transparent 25%, rgba(255,255,255,.26) 50%, rgba(0,0,0,.32) 85%);
}
.leaf.animating .lighting{
  opacity:1;
}

/* Tombol Panah Kiri & Kanan di Samping Majalah */
.side-nav{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  z-index:999;
  pointer-events:auto;
  width:54px;
  height:54px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.32);
  background:rgba(20,12,14,.72);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.55);
  transition:all .22s ease;
}
.side-nav svg{
  width:26px;
  height:26px;
  stroke:currentColor;
  stroke-width:2.5;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
  pointer-events:none;
}
.side-nav.prev{ left:max(14px, 3vw); }
.side-nav.next{ right:max(14px, 3vw); }

.side-nav:hover:not(:disabled){
  background:var(--gold);
  color:#290900;
  border-color:var(--gold);
  transform:translateY(-50%) scale(1.08);
  box-shadow:0 10px 28px rgba(255,212,0,.35);
}
.side-nav:active:not(:disabled){
  transform:translateY(-50%) scale(0.96);
}
.side-nav:disabled{
  opacity:.2;
  cursor:not-allowed;
  pointer-events:none;
}

@media(max-width:720px){
  header{padding-top:14px}
  .stage{padding:8px 12px 18px}
  .book-wrap{height:auto;width:94vw;max-width:94vw;max-height:76vh}
  .side-nav{width:44px;height:44px;background:rgba(15,10,12,.82)}
  .side-nav svg{width:22px;height:22px}
  .side-nav.prev{left:8px}
  .side-nav.next{right:8px}
}
</style>
</head>
<body>
<header>
  <div class="eyebrow">Majalah Olahraga • Volume 67 • Edisi 2</div>
  <h1><span>Formula 1</span> — The Most Difficult Sport</h1>
</header>

<main class="stage">
  <button type="button" class="side-nav prev" id="prevBtn" title="Halaman Sebelumnya" aria-label="Halaman Sebelumnya">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
  </button>

  <div class="book-wrap" id="bookWrap" aria-label="Flipbook majalah">
    <div class="book pos-cover" id="book"></div>
  </div>

  <button type="button" class="side-nav next" id="nextBtn" title="Halaman Berikutnya" aria-label="Halaman Berikutnya">
    <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
  </button>
</main>

<script>
const leavesData = [
  { front: "assets/page-01.jpg", back: "assets/page-02.jpg" },
  { front: "assets/page-03.jpg", back: "assets/page-04.jpg" }
];

const book = document.getElementById('book');
const wrap = document.getElementById('bookWrap');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

let state = 0; // 0 = Hal 1 (Sampul Depan), 1 = Hal 2 & 3 (Isi), 2 = Hal 4 (Sampul Belakang)
let busy = false;

function setAspectRatio(img) {
  if (img.naturalWidth && img.naturalHeight) {
    const ratio = img.naturalWidth / img.naturalHeight;
    document.documentElement.style.setProperty('--ratio', ratio.toFixed(4));
  }
}

function build() {
  book.innerHTML = '';
  leavesData.forEach((leaf, i) => {
    const el = document.createElement('div');
    el.className = 'leaf';
    el.style.zIndex = String(leavesData.length - i);

    const front = document.createElement('div');
    front.className = 'face front';
    const imgF = document.createElement('img');
    imgF.src = leaf.front;
    imgF.alt = `Halaman ${i * 2 + 1}`;
    imgF.draggable = false;

    if (i === 0) {
      if (imgF.complete) setAspectRatio(imgF);
      else imgF.onload = () => setAspectRatio(imgF);
    }

    const lightF = document.createElement('div');
    lightF.className = 'lighting';
    front.appendChild(imgF);
    front.appendChild(lightF);

    const back = document.createElement('div');
    back.className = 'face back';
    const imgB = document.createElement('img');
    imgB.src = leaf.back;
    imgB.alt = `Halaman ${i * 2 + 2}`;
    imgB.draggable = false;

    const lightB = document.createElement('div');
    lightB.className = 'lighting';
    back.appendChild(imgB);
    back.appendChild(lightB);

    el.appendChild(front);
    el.appendChild(back);

    el.addEventListener('click', (e) => {
      e.stopPropagation();
      if (el.classList.contains('flipped')) go(state - 1);
      else go(state + 1);
    });

    book.appendChild(el);
  });
  update(false);
}

function update(animate = true) {
  const els = [...book.children];

  book.classList.remove('pos-cover', 'pos-spread', 'pos-back');
  if (state === 0) book.classList.add('pos-cover');
  else if (state === 1) book.classList.add('pos-spread');
  else book.classList.add('pos-back');

  els.forEach((el, i) => {
    const isFlipped = i < state;
    const wasFlipped = el.classList.contains('flipped');

    if (animate && isFlipped !== wasFlipped) {
      el.classList.add('animating');
      el.style.zIndex = String(leavesData.length + 10);
      setTimeout(() => {
        el.classList.remove('animating');
        el.style.zIndex = String(isFlipped ? i + 1 : leavesData.length - i);
      }, 900);
    } else if (!animate) {
      el.style.zIndex = String(isFlipped ? i + 1 : leavesData.length - i);
    }

    el.classList.toggle('flipped', isFlipped);
  });

  prevBtn.disabled = state === 0;
  nextBtn.disabled = state === leavesData.length;
}

function go(n) {
  if (busy) return;
  const target = Math.max(0, Math.min(leavesData.length, n));
  if (target === state) return;
  busy = true;
  state = target;
  update(true);
  setTimeout(() => { busy = false; }, 900);
}

prevBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  go(state - 1);
});

nextBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  go(state + 1);
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown') go(state + 1);
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(state - 1);
});

let startX = null;
wrap.addEventListener('touchstart', e => { startX = e.changedTouches[0].clientX; }, { passive: true });
wrap.addEventListener('touchend', e => {
  if (startX === null) return;
  const dx = e.changedTouches[0].clientX - startX;
  if (Math.abs(dx) > 45) go(state + (dx < 0 ? 1 : -1));
  startX = null;
}, { passive: true });

build();
</script>
</body>
</html>
