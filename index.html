<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#650000">
<title>Majalah Olahraga — Flipbook</title>
<style>
:root{--red:#710000;--red2:#a60000;--gold:#ffd400;--ink:#f7f3ed;--ratio:0.707}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 25%,#4b1717 0,#1a1012 52%,#09090b 100%);color:var(--ink);font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column;overflow-x:hidden}
header{padding:16px 22px 6px;text-align:center}
header .eyebrow{font-size:11px;letter-spacing:4px;color:#e6b7a5;text-transform:uppercase}
header h1{margin:5px 0 0;font-size:clamp(18px,2.8vw,28px);letter-spacing:2px;text-transform:uppercase}
header h1 span{color:var(--gold)}

.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 18px 14px;min-height:0;overflow:hidden}

/* Kontainer selebar 2 halaman terbuka (spread), bergeser otomatis agar posisi tengah selalu presisi */
.book-wrap{
  position:relative;
  height:min(74vh, 760px);
  width:auto;
  aspect-ratio:calc(var(--ratio) * 2);
  max-width:94vw;
  perspective:2600px;
  transition:transform .4s cubic-bezier(.25,.8,.25,1);
  filter:drop-shadow(0 26px 38px rgba(0,0,0,.8));
}

.book{
  position:relative;
  width:100%;
  height:100%;
  transform-style:preserve-3d;
  transition:transform .85s cubic-bezier(0.645, 0.045, 0.355, 1);
}

/* Menggeser posisi buku agar cover depan & belakang berada tepat di tengah layar */
.book.pos-cover{ transform:translateX(-25%); }
.book.pos-spread{ transform:translateX(0%); }
.book.pos-back{ transform:translateX(25%); }

/* Setiap lembar fisik memiliki sisi depan dan sisi belakang (bolak-balik) */
.leaf{
  position:absolute;
  top:0;
  right:0;
  width:50%;
  height:100%;
  transform-origin:left center;
  transform-style:preserve-3d;
  cursor:pointer;
  will-change:transform;
  transition:transform .9s cubic-bezier(0.645, 0.045, 0.355, 1);
}

.leaf.flipped{
  transform:rotateY(-180deg);
}

.face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  overflow:hidden;
  background:#1c1917;
}

.face.front{
  border-radius:2px 8px 8px 2px;
  box-shadow:inset 10px 0 20px rgba(0,0,0,.35);
}

.face.back{
  transform:rotateY(180deg);
  border-radius:8px 2px 2px 8px;
  box-shadow:inset -10px 0 20px rgba(0,0,0,.35);
}

.face img{
  display:block;
  width:100%;
  height:100%;
  object-fit:fill; /* 0% ruang putih di atas dan bawah kertas */
  user-select:none;
}

/* Efek lipatan tengah majalah (Spine Crease) */
.face.front::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(to right, rgba(0,0,0,.42) 0%, rgba(0,0,0,.1) 3%, rgba(255,255,255,.15) 6%, transparent 15%);
}
.face.back::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(to left, rgba(0,0,0,.42) 0%, rgba(0,0,0,.1) 3%, rgba(255,255,255,.15) 6%, transparent 15%);
}

/* Pencahayaan dinamis saat kertas melayang di udara */
.lighting{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
  transition:opacity .45s ease;
}
.face.front .lighting{
  background:linear-gradient(105deg, transparent 25%, rgba(255,255,255,.26) 50%, rgba(0,0,0,.32) 85%);
}
.face.back .lighting{
  background:linear-gradient(-105deg, transparent 25%, rgba(255,255,255,.26) 50%, rgba(0,0,0,.32) 85%);
}
.leaf.animating .lighting{
  opacity:1;
}

.controls{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:8px 16px 16px}
button{border:1px solid #ffffff35;background:#ffffff12;color:#fff;border-radius:999px;padding:9px 15px;font-weight:700;cursor:pointer;transition:.2s}
button:hover:not(:disabled){background:#ffffff25;border-color:#ffd400}
button:disabled{opacity:.35;cursor:not-allowed}
button.primary{background:var(--gold);color:#290900;border-color:var(--gold)}
button.primary:hover:not(:disabled){background:#ffe65a}
.counter{min-width:135px;text-align:center;font-size:13px;color:#f2d9d3;font-variant-numeric:tabular-nums}
.progress{width:min(200px,34vw);accent-color:var(--gold);cursor:pointer}
.hint{text-align:center;color:#bba9a7;font-size:11px;padding:0 12px 12px}

@media(max-width:720px){
  header{padding-top:12px}
  .stage{padding:6px 8px}
  .book-wrap{height:auto;width:94vw;max-height:66vh}
  .controls{gap:6px;padding-bottom:12px}
  button{padding:8px 11px;font-size:12px}
  .progress{width:100%;order:2;max-width:280px}
}
</style>
</head>
<body>
<header>
  <div class="eyebrow">Majalah Olahraga • Volume 67 • Edisi 2</div>
  <h1><span>Formula 1</span> — The Most Difficult Sport</h1>
</header>
<main class="stage">
  <div class="book-wrap" id="bookWrap" aria-label="Flipbook majalah">
    <div class="book pos-cover" id="book"></div>
  </div>
</main>
<nav class="controls" aria-label="Kontrol halaman">
  <button id="firstBtn" title="Sampul Depan">|‹</button>
  <button id="prevBtn">‹ Sebelumnya</button>
  <span class="counter" id="counter">Sampul Depan (1)</span>
  <button class="primary" id="nextBtn">Berikutnya ›</button>
  <button id="lastBtn" title="Sampul Belakang">›|</button>
  <input class="progress" id="pageSlider" type="range" min="0" max="2" value="0" aria-label="Pilih tampilan">
  <button id="zoomBtn" title="Perbesar tampilan">＋</button>
  <button id="fullBtn" title="Layar penuh">⛶</button>
</nav>
<div class="hint">Klik halaman untuk membalik, gunakan tombol panah ← →, atau geser di layar sentuh.</div>

<script>
// 4 Halaman disusun menjadi 2 lembar fisik bolak-balik:
// Lembar 1: Depan = Hal 1 (Sampul Depan), Belakang = Hal 2 (Isi Kiri)
// Lembar 2: Depan = Hal 3 (Isi Kanan), Belakang = Hal 4 (Sampul Belakang)
const leavesData = [
  { front: "assets/page-01.jpg", back: "assets/page-02.jpg" },
  { front: "assets/page-03.jpg", back: "assets/page-04.jpg" }
];

const labels = [
  "Hal. 1 (Sampul Depan)",
  "Hal. 2 — 3 (Isi)",
  "Hal. 4 (Sampul Belakang)"
];

const book = document.getElementById('book');
const wrap = document.getElementById('bookWrap');
const counter = document.getElementById('counter');
const slider = document.getElementById('pageSlider');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

let state = 0; // 0 = Cover Depan, 1 = Terbuka (Hal 2 & 3), 2 = Cover Belakang
let busy = false;
let zoomed = false;

function build(){
  book.innerHTML = '';
  leavesData.forEach((leaf, i) => {
    const el = document.createElement('div');
    el.className = 'leaf';
    el.style.zIndex = String(leavesData.length - i);

    // Sisi Depan Lembar
    const front = document.createElement('div');
    front.className = 'face front';
    const imgF = document.createElement('img');
    imgF.src = leaf.front;
    imgF.alt = `Halaman ${i * 2 + 1}`;
    imgF.draggable = false;

    // Deteksi rasio asli halaman pertama agar 0% garis putih
    if (i === 0) {
      imgF.onload = () => {
        if (imgF.naturalWidth && imgF.naturalHeight) {
          const ratio = imgF.naturalWidth / imgF.naturalHeight;
          document.documentElement.style.setProperty('--ratio', ratio.toFixed(4));
        }
      };
    }

    const lightF = document.createElement('div');
    lightF.className = 'lighting';
    front.appendChild(imgF);
    front.appendChild(lightF);

    // Sisi Belakang Lembar
    const back = document.createElement('div');
    back.className = 'face back';
    const imgB = document.createElement('img');
    imgB.src = leaf.back;
    imgB.alt = `Halaman ${i * 2 + 2}`;
    imgB.draggable = false;

    const lightB = document.createElement('div');
    lightB.className = 'lighting';
    back.appendChild(imgB);
    back.appendChild(lightB);

    el.appendChild(front);
    el.appendChild(back);

    // Klik lembar di kanan -> balik maju | Klik lembar di kiri -> balik mundur
    el.addEventListener('click', () => {
      if (el.classList.contains('flipped')) go(state - 1);
      else go(state + 1);
    });

    book.appendChild(el);
  });
  update(false);
}

function update(animate = true){
  const els = [...book.children];

  // Atur posisi tengah buku secara otomatis
  book.classList.remove('pos-cover', 'pos-spread', 'pos-back');
  if (state === 0) book.classList.add('pos-cover');
  else if (state === 1) book.classList.add('pos-spread');
  else book.classList.add('pos-back');

  els.forEach((el, i) => {
    const isFlipped = i < state;
    const wasFlipped = el.classList.contains('flipped');

    if (animate && isFlipped !== wasFlipped) {
      el.classList.add('animating');
      el.style.zIndex = String(leavesData.length + 10);
      setTimeout(() => {
        el.classList.remove('animating');
        el.style.zIndex = String(isFlipped ? i + 1 : leavesData.length - i);
      }, 900);
    } else if (!animate) {
      el.style.zIndex = String(isFlipped ? i + 1 : leavesData.length - i);
    }

    el.classList.toggle('flipped', isFlipped);
  });

  counter.textContent = labels[state];
  slider.value = String(state);
  prevBtn.disabled = state === 0;
  nextBtn.disabled = state === 2;
  document.getElementById('firstBtn').disabled = state === 0;
  document.getElementById('lastBtn').disabled = state === 2;
}

function go(n){
  if (busy) return;
  const target = Math.max(0, Math.min(2, n));
  if (target === state) return;
  busy = true;
  state = target;
  update(true);
  setTimeout(() => { busy = false; }, 900);
}

prevBtn.onclick = () => go(state - 1);
nextBtn.onclick = () => go(state + 1);
document.getElementById('firstBtn').onclick = () => go(0);
document.getElementById('lastBtn').onclick = () => go(2);
slider.oninput = e => go(Number(e.target.value));

document.getElementById('zoomBtn').onclick = () => {
  zoomed = !zoomed;
  wrap.style.transform = zoomed ? 'scale(1.22)' : 'scale(1)';
  document.getElementById('zoomBtn').textContent = zoomed ? '－' : '＋';
};

document.getElementById('fullBtn').onclick = async () => {
  if (!document.fullscreenElement) { await document.documentElement.requestFullscreen?.(); }
  else { await document.exitFullscreen?.(); }
};

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown') go(state + 1);
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(state - 1);
  if (e.key === 'Home') go(0);
  if (e.key === 'End') go(2);
});

let startX = null;
wrap.addEventListener('touchstart', e => { startX = e.changedTouches[0].clientX; }, { passive: true });
wrap.addEventListener('touchend', e => {
  if (startX === null) return;
  const dx = e.changedTouches[0].clientX - startX;
  if (Math.abs(dx) > 45) go(state + (dx < 0 ? 1 : -1));
  startX = null;
}, { passive: true });

build();
</script>
</body>
</html>
