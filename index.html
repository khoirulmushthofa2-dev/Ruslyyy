<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#650000">
<title>Majalah Olahraga — Flipbook</title>
<style>
:root{--red:#710000;--red2:#a60000;--gold:#ffd400;--ink:#f7f3ed;--ratio:0.707}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 25%,#4b1717 0,#1a1012 52%,#09090b 100%);color:var(--ink);font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column;overflow-x:hidden}
header{padding:18px 22px 6px;text-align:center}
header .eyebrow{font-size:11px;letter-spacing:4px;color:#e6b7a5;text-transform:uppercase}
header h1{margin:5px 0 0;font-size:clamp(18px,2.8vw,28px);letter-spacing:2px;text-transform:uppercase}
header h1 span{color:var(--gold)}

.stage{
  position:relative;
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px 76px 24px;
  min-height:0;
  overflow:hidden;
}

.book-wrap{
  position:relative;
  z-index:1;
  height:min(82vh, 840px);
  width:auto;
  aspect-ratio:calc(var(--ratio) * 2);
  max-width:calc(100vw - 152px);
  display:flex;
  align-items:center;
  justify-content:center;
  filter:drop-shadow(0 28px 42px rgba(0,0,0,.88));
}

canvas#flipCanvas{
  width:100%;
  height:100%;
  display:block;
  border-radius:6px;
}

.side-nav{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  z-index:999;
  pointer-events:auto;
  width:54px;
  height:54px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.32);
  background:rgba(20,12,14,.72);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.55);
  transition:all .22s ease;
}
.side-nav svg{
  width:26px;
  height:26px;
  stroke:currentColor;
  stroke-width:2.5;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
  pointer-events:none;
}
.side-nav.prev{ left:max(14px, 3vw); }
.side-nav.next{ right:max(14px, 3vw); }

.side-nav:hover:not(:disabled){
  background:var(--gold);
  color:#290900;
  border-color:var(--gold);
  transform:translateY(-50%) scale(1.08);
  box-shadow:0 10px 28px rgba(255,212,0,.35);
}
.side-nav:active:not(:disabled){
  transform:translateY(-50%) scale(0.96);
}
.side-nav:disabled{
  opacity:.2;
  cursor:not-allowed;
  pointer-events:none;
}

@media(max-width:720px){
  header{padding-top:14px}
  .stage{padding:8px 12px 18px}
  .book-wrap{height:auto;width:94vw;max-width:94vw;max-height:76vh}
  .side-nav{width:44px;height:44px;background:rgba(15,10,12,.82)}
  .side-nav svg{width:22px;height:22px}
  .side-nav.prev{left:8px}
  .side-nav.next{right:8px}
}
</style>
</head>
<body>
<header>
  <div class="eyebrow">Majalah Olahraga • Volume 67 • Edisi 2</div>
  <h1><span>Formula 1</span> — The Most Difficult Sport</h1>
</header>

<main class="stage">
  <button type="button" class="side-nav prev" id="prevBtn" title="Halaman Sebelumnya" aria-label="Halaman Sebelumnya">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
  </button>

  <div class="book-wrap" id="bookWrap" aria-label="Flipbook majalah">
    <canvas id="flipCanvas"></canvas>
  </div>

  <button type="button" class="side-nav next" id="nextBtn" title="Halaman Berikutnya" aria-label="Halaman Berikutnya">
    <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
  </button>
</main>

<script>
const pageSources = [
  "assets/page-01.jpg",
  "assets/page-02.jpg",
  "assets/page-03.jpg",
  "assets/page-04.jpg"
];

const canvas = document.getElementById('flipCanvas');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('bookWrap');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

const images = [];
let loadedCount = 0;

// State: 0 = Hal 1 (Sampul Depan), 1 = Hal 2 & 3 (Isi), 2 = Hal 4 (Sampul Belakang)
let state = 0;
let targetState = 0;
let isAnimating = false;

// Memuat semua gambar terlebih dahulu agar render kanvas tajam & bebas kedip
pageSources.forEach((src, idx) => {
  const img = new Image();
  img.src = src;
  img.onload = () => {
    loadedCount++;
    if (idx === 0 && img.naturalWidth && img.naturalHeight) {
      const ratio = img.naturalWidth / img.naturalHeight;
      document.documentElement.style.setProperty('--ratio', ratio.toFixed(4));
    }
    if (loadedCount === pageSources.length) {
      resizeCanvas();
      drawStatic();
    }
  };
  images.push(img);
});

function resizeCanvas() {
  const rect = wrap.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!isAnimating && loadedCount === pageSources.length) {
    drawStatic();
  }
}

window.addEventListener('resize', resizeCanvas);

function syncButtons() {
  prevBtn.disabled = targetState === 0;
  nextBtn.disabled = targetState === 2;
}

// Menggambar bayangan lipatan tengah buku (spine shadow) pada halaman terbuka
function drawSpineCrease(x, y, w, h, side) {
  const grad = side === 'left'
    ? ctx.createLinearGradient(x + w - w * 0.14, y, x + w, y)
    : ctx.createLinearGradient(x, y, x + w * 0.14, y);

  if (side === 'left') {
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(0.65, 'rgba(255,255,255,0.12)');
    grad.addColorStop(0.88, 'rgba(0,0,0,0.14)');
    grad.addColorStop(1, 'rgba(0,0,0,0.42)');
  } else {
    grad.addColorStop(0, 'rgba(0,0,0,0.42)');
    grad.addColorStop(0.12, 'rgba(0,0,0,0.14)');
    grad.addColorStop(0.35, 'rgba(255,255,255,0.12)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
  }
  ctx.fillStyle = grad;
  ctx.fillRect(x, y, w, h);
}

// Helper untuk menggambar kotak bersudut melengkung pada sisi luar majalah
function roundPagePath(x, y, w, h, rLeft, rRight) {
  ctx.beginPath();
  ctx.moveTo(x + rLeft, y);
  ctx.lineTo(x + w - rRight, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rRight);
  ctx.lineTo(x + w, y + h - rRight);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rRight, y + h);
  ctx.lineTo(x + rLeft, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rLeft);
  ctx.lineTo(x, y + rLeft);
  ctx.quadraticCurveTo(x, y, x + rLeft, y);
  ctx.closePath();
}

function drawPageImage(img, x, y, w, h, side) {
  if (!img || !img.complete) return;
  ctx.save();
  const rL = side === 'left' ? 8 : 2;
  const rR = side === 'right' ? 8 : 2;
  roundPagePath(x, y, w, h, rL, rR);
  ctx.clip();
  ctx.drawImage(img, x, y, w, h);
  drawSpineCrease(x, y, w, h, side);
  ctx.restore();
}

// Menggambar tampilan diam (tidak sedang melengkung)
function drawStatic() {
  const W = wrap.clientWidth;
  const H = wrap.clientHeight;
  const pageW = W / 2;
  ctx.clearRect(0, 0, W, H);

  if (state === 0) {
    // Sampul Depan (Hal. 1) tepat di tengah
    drawPageImage(images[0], pageW * 0.5, 0, pageW, H, 'right');
  } else if (state === 1) {
    // Halaman Terbuka: Hal. 2 di kiri, Hal. 3 di kanan
    drawPageImage(images[1], 0, 0, pageW, H, 'left');
    drawPageImage(images[2], pageW, 0, pageW, H, 'right');
  } else if (state === 2) {
    // Sampul Belakang (Hal. 4) tepat di tengah
    drawPageImage(images[3], pageW * 0.5, 0, pageW, H, 'left');
  }
}

// Mesin Render Lipatan Kertas 2D Realistis (Tanpa Robek & Tanpa Tembus)
function renderCurlFrame(fromState, toState, progress) {
  const W = wrap.clientWidth;
  const H = wrap.clientHeight;
  const pageW = W / 2;
  ctx.clearRect(0, 0, W, H);

  const forward = toState > fromState;
  // Normalisasi kemajuan fisik: 0 = lembar berada di kanan, 1 = lembar berada di kiri
  const p = forward ? progress : 1 - progress;
  const stepIndex = forward ? fromState : toState; // 0: transisi (0 <-> 1), 1: transisi (1 <-> 2)

  // Pergeseran horizontal pusat buku agar cover (1 halaman) & spread (2 halaman) selalu pas di tengah
  let shiftX = 0;
  if (stepIndex === 0) {
    // Dari -pageW/2 (cover di tengah) menuju 0 (spread terbuka)
    shiftX = -pageW * 0.5 * (1 - p);
  } else {
    // Dari 0 (spread terbuka) menuju +pageW/2 (sampul belakang di tengah)
    shiftX = pageW * 0.5 * p;
  }

  ctx.save();
  ctx.translate(shiftX, 0);

  const spineX = pageW;
  const rightEdgeX = pageW * 2;
  const leftEdgeX = 0;

  // Tentukan 4 lapisan gambar untuk transisi saat ini:
  // baseLeft: halaman diam di sisi kiri bawah
  // baseRight: halaman diam di sisi kanan bawah
  // turningFront: sisi depan kertas yang sedang dibalik (menghadap kanan saat p=0)
  // turningBack: sisi belakang kertas yang sedang dibalik (menghadap kiri saat p=1)
  let baseLeft = null, baseRight = null, turningFront = null, turningBack = null;

  if (stepIndex === 0) {
    baseLeft = null;
    baseRight = images[2];     // Hal. 3 menunggu di bawah Sampul Depan
    turningFront = images[0];  // Hal. 1 (Sampul Depan)
    turningBack = images[1];   // Hal. 2 (Isi Kiri)
  } else {
    baseLeft = images[1];      // Hal. 2 tetap diam di kiri
    baseRight = null;
    turningFront = images[2];  // Hal. 3 (Isi Kanan)
    turningBack = images[3];   // Hal. 4 (Sampul Belakang)
  }

  // 1. Gambar Lapisan Dasar (Halaman Diam di Bawah)
  if (baseLeft) {
    drawPageImage(baseLeft, leftEdgeX, 0, pageW, H, 'left');
  }
  if (baseRight) {
    drawPageImage(baseRight, spineX, 0, pageW, H, 'right');
  }

  // 2. Hitung Geometri Lipatan Kertas (Fold Line & Curl Width)
  // Posisi tepi kertas yang sedang ditarik melintasi sumbu X
  const tipX = rightEdgeX - (pageW * 2) * p;
  // Lebar gulungan lipatan membesar di tengah lintasan dan mengecil saat mendarat
  const archSin = Math.sin(p * Math.PI);
  const curlRadius = pageW * 0.24 * archSin;

  // Garis lipatan (foldX) berada di antara jilid tengah (spineX) dan ujung tarikan
  const foldX = spineX + (pageW * (1 - p)) - curlRadius * 0.45;
  // Kemiringan sudut tarikan (seperti jari menarik dari tepi bawah/tengah)
  const slant = archSin * 18 * (forward ? 1 : -1);

  // 3. Gambar Sisi Depan Lembar yang Tersisa di Kanan (dari spineX hingga garis lipatan)
  if (foldX > spineX + 0.5 && turningFront) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(spineX, 0);
    ctx.lineTo(Math.min(rightEdgeX, foldX - slant * 0.35), 0);
    ctx.lineTo(Math.min(rightEdgeX, foldX + slant * 0.65), H);
    ctx.lineTo(spineX, H);
    ctx.closePath();
    ctx.clip();

    ctx.drawImage(turningFront, spineX, 0, pageW, H);
    drawSpineCrease(spineX, 0, pageW, H, 'right');

    // Bayangan lipatan dalam di sebelah kiri garis lipatan
    const innerGrad = ctx.createLinearGradient(foldX - curlRadius * 1.1, 0, foldX + 6, 0);
    innerGrad.addColorStop(0, 'rgba(0,0,0,0)');
    innerGrad.addColorStop(1, `rgba(0,0,0,${(0.32 * archSin).toFixed(3)})`);
    ctx.fillStyle = innerGrad;
    ctx.fillRect(spineX, 0, pageW, H);
    ctx.restore();
  }

  // 4. Bayangan Jatuh ke Halaman Dasar di Sebelah Kiri (Cast Shadow)
  const shadowSpan = Math.max(16, curlRadius * 1.6);
  const dropStart = Math.max(leftEdgeX, foldX - shadowSpan);
  if (foldX > leftEdgeX) {
    const dropGrad = ctx.createLinearGradient(dropStart, 0, foldX, 0);
    dropGrad.addColorStop(0, 'rgba(0,0,0,0)');
    dropGrad.addColorStop(1, `rgba(0,0,0,${(0.42 * archSin).toFixed(3)})`);
    ctx.fillStyle = dropGrad;
    ctx.fillRect(dropStart, 0, foldX - dropStart, H);
  }

  // 5. Gambar Sisi Belakang Kertas yang Terlipat & Melengkung ke Kiri (turningBack)
  // Lebar area sisi belakang yang terlihat tumbuh dari 0 hingga penuh pageW saat p -> 1
  const backVisibleW = pageW * p;
  if (backVisibleW > 0.5 && turningBack) {
    const backLeftX = foldX - backVisibleW;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(backLeftX - slant * 0.35, 0);
    ctx.lineTo(foldX - slant * 0.35, 0);
    ctx.lineTo(foldX + slant * 0.65, H);
    ctx.lineTo(backLeftX + slant * 0.65, H);
    ctx.closePath();
    ctx.clip();

    // Render gambar sisi belakang tepat mengisi area yang terbalik
    ctx.drawImage(turningBack, backLeftX, 0, pageW, H);

    // Bayangan jilid saat kertas mendekati posisi mendarat di kiri
    if (p > 0.65) {
      drawSpineCrease(backLeftX, 0, pageW, H, 'left');
    }

    // Efek Pencahayaan Silinder Melengkung (3D Paper Curl Highlight & Crease Shadow)
    const curlHighlightW = Math.max(14, curlRadius * 1.45);
    const curlGrad = ctx.createLinearGradient(foldX - curlHighlightW, 0, foldX, 0);
    curlGrad.addColorStop(0, 'rgba(0,0,0,0)');
    curlGrad.addColorStop(0.35, `rgba(255,255,255,${(0.34 * archSin).toFixed(3)})`);
    curlGrad.addColorStop(0.72, `rgba(255,255,255,${(0.12 * archSin).toFixed(3)})`);
    curlGrad.addColorStop(0.92, `rgba(0,0,0,${(0.24 * archSin).toFixed(3)})`);
    curlGrad.addColorStop(1, `rgba(0,0,0,${(0.45 * archSin).toFixed(3)})`);

    ctx.fillStyle = curlGrad;
    ctx.fillRect(backLeftX - 30, 0, pageW + 60, H);
    ctx.restore();

    // Garis tepi tipis pada lipatan kertas agar siluet lipatan terlihat tajam
    ctx.save();
    ctx.strokeStyle = `rgba(255,255,255,${(0.25 * archSin).toFixed(2)})`;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(foldX - slant * 0.35, 0);
    ctx.lineTo(foldX + slant * 0.65, H);
    ctx.stroke();
    ctx.restore();
  }

  ctx.restore();
}

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function processQueue() {
  if (isAnimating) return;
  if (state === targetState) return;
  if (loadedCount < pageSources.length) return;

  isAnimating = true;
  const remainingSteps = Math.abs(targetState - state);
  const duration = remainingSteps > 1 ? 420 : 880;

  const fromState = state;
  const toState = state + (targetState > state ? 1 : -1);
  const startTime = performance.now();

  function step(now) {
    const raw = Math.min(1, (now - startTime) / duration);
    const eased = easeInOutCubic(raw);

    renderCurlFrame(fromState, toState, eased);

    if (raw < 1) {
      requestAnimationFrame(step);
    } else {
      state = toState;
      isAnimating = false;
      drawStatic();
      if (state !== targetState) {
        processQueue();
      }
    }
  }

  requestAnimationFrame(step);
}

function queueStep(delta) {
  const nextTarget = Math.max(0, Math.min(2, targetState + delta));
  if (nextTarget === targetState) return;
  targetState = nextTarget;
  syncButtons();
  processQueue();
}

prevBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  queueStep(-1);
});

nextBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  queueStep(1);
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown') queueStep(1);
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') queueStep(-1);
});

let startX = null;
wrap.addEventListener('touchstart', e => { startX = e.changedTouches[0].clientX; }, { passive: true });
wrap.addEventListener('touchend', e => {
  if (startX === null) return;
  const dx = e.changedTouches[0].clientX - startX;
  if (Math.abs(dx) > 45) queueStep(dx < 0 ? 1 : -1);
  startX = null;
}, { passive: true });

syncButtons();
</script>
</body>
</html>
